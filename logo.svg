<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Gradasi Latar Belakang -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d9488" /> <!-- Teal -->
            <stop offset="100%" stop-color="#0284c7" /> <!-- Biru -->
        </linearGradient>
        
        <!-- Efek Bayangan Lembut -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Kotak Latar Belakang (Rounded) -->
    <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

    <!-- Ikon Rumah dan Hati -->
    <g filter="url(#shadow)">
        <!-- Atap Rumah -->
        <path d="M 110 210 L 256 85 L 402 210" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Dinding Rumah -->
        <path d="M 150 180 L 150 330 C 150 346.5 163.5 360 180 360 L 332 360 C 348.5 360 362 346.5 362 330 L 362 180" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Hati Emas (Cinta & Kesejahteraan) -->
        <path d="M 256 205 C 225 175 175 185 175 235 C 175 275 256 325 256 325 C 256 325 337 275 337 235 C 337 185 287 175 256 205 Z" fill="#fbbf24" />
    </g>

    <!-- Teks Nama Aplikasi -->
    <text x="256" y="440" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">NizamNuha</text>
    <text x="256" y="475" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="600" fill="#bae6fd" text-anchor="middle" letter-spacing="8">FAMILY</text>
</svg>